name: Docker CI

# Events that trigger the workflow
on:

  # Trigger on push or pull request to the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Use a GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Set permissions for the workflow steps to control access to repository contents and packages
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout the repository to the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4 # Is like a car that brings your code to the runner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Specify the Node.js version to use the commands like (npm ci, npm test)
          cache: 'npm' # Cache npm dependencies to speed up subsequent builds
          cache-dependency-path: rest-api/package-lock.json

      - name: Install dependencies
        working-directory: ./rest-api # Set the working directory to the REST API folder
        run: npm ci # Install project dependencies in a clean environment

      - name: Run tests
        working-directory: ./rest-api # Set the working directory to the REST API folder
        run: npm test # Run the test suite to ensure code correctness

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  

      # Build the Docker image for the CI pipeline
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./rest-api
          push: true
          tags: ghcr.io/${{ github.repository }}:latest